<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#fbcfe8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nosso Bolso">
    
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Nosso%20Bolso%22%2C%22short_name%22%3A%22Nosso%20Bolso%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23fbcfe8%22%2C%22theme_color%22%3A%22%23ec4899%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%8C%B8%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
    
    <title>Nosso Bolso 🌸</title>
    
    <!-- Tailwind CSS (Estilos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel (Tradutor do React) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-pink-50">
    <div id="root">
        <!-- Tela de Carregamento Rápida -->
        <div style="display:flex; height:100vh; align-items:center; justify-content:center; flex-direction:column; gap:12px; color:#ec4899;">
            <svg class="animate-spin h-10 w-10" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p style="font-weight:bold; font-family:sans-serif;">A abrir o Nosso Bolso...</p>
        </div>
    </div>

    <!-- Detector de Erros -->
    <script>
        window.onerror = function(message) {
            document.getElementById('root').innerHTML = 
                '<div style="padding:20px; color:#e11d48; text-align:center; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; justify-content:center;">' +
                '<h2 style="font-size:20px; font-weight:bold; margin-bottom:8px;">Ops! Ocorreu um problema.</h2>' +
                '<p>' + message + '</p>' +
                '<p style="font-size:12px; color:#888; margin-top:12px;">Se isto persistir, recarregue a página.</p></div>';
        };
    </script>

    <script type="text/babel" data-type="module" data-presets="react">
        // Importando React
        import React, { useState, useMemo, useRef, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        // Importando Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // Importando Ícones
        import { 
            Home, ReceiptText, Target, Plus, Plane, CreditCard, 
            ShoppingCart, Utensils, Zap, Car, Heart, TrendingUp, X, 
            Users, ChevronLeft, ChevronRight, Repeat, Gift, 
            Flower, Sparkles, Camera, CalendarHeart, Clock, CalendarDays, 
            Trash2, Pencil, AlertCircle, ImagePlus, Flame, PiggyBank, 
            CheckCircle2, Circle, ListTodo, Trophy, Settings, Search,
            MessageSquare, PieChart, Tag, Layers
        } from 'https://esm.sh/lucide-react@0.344.0?bundle';

        // --- CONFIGURAÇÃO DO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDyWO6W5AEscA061bwG91u68TfX2FVycek",
            authDomain: "nosso-bolso-d88a0.firebaseapp.com",
            projectId: "nosso-bolso-d88a0",
            storageBucket: "nosso-bolso-d88a0.firebasestorage.app",
            messagingSenderId: "101766584028",
            appId: "1:101766584028:web:f97ced5cc5a84170e98619"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appDatabaseId = "nosso-bolso-v2";

        // --- COMPRESSÃO DE IMAGEM ---
        const compressImage = (file, maxWidth = 800) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(maxWidth / img.width, 1);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        // --- UTILITÁRIO PARA MOEDA ---
        const parseCurrency = (val) => {
            if (!val) return 0;
            return parseFloat(String(val).replace(',', '.')) || 0;
        };

        // Paleta de cores para gráficos
        const chartColors = ['bg-pink-400', 'bg-purple-400', 'bg-sky-400', 'bg-emerald-400', 'bg-amber-400', 'bg-rose-500', 'bg-indigo-400', 'bg-fuchsia-400', 'bg-teal-400'];

        function App() {
            const [user, setUser] = useState(null);
            const [authError, setAuthError] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Modais
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isAddChallengeModalOpen, setIsAddChallengeModalOpen] = useState(false);
            const [isAddSubModalOpen, setIsAddSubModalOpen] = useState(false);
            const [isAddDateModalOpen, setIsAddDateModalOpen] = useState(false);
            const [isAddBudgetModalOpen, setIsAddBudgetModalOpen] = useState(false);
            const [showMimoModal, setShowMimoModal] = useState(false);
            const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
            
            // Estado para apagar parcelados
            const [txToDelete, setTxToDelete] = useState(null);

            // Dados Sincronizados
            const [transactions, setTransactions] = useState([]);
            const [goals, setGoals] = useState([]);
            const [subscriptions, setSubscriptions] = useState([]);
            const [specialDates, setSpecialDates] = useState([]);
            const [challenges, setChallenges] = useState([]);
            const [wishlist, setWishlist] = useState([]);
            const [budgets, setBudgets] = useState([]);
            const [notes, setNotes] = useState([]); // Recados
            const [settings, setSettings] = useState({ 
                user1Name: 'Samile', 
                user2Name: 'Cristiamberg', 
                couplePhoto: null, 
                startDate: '2023-06-12',
                customCategories: null,
                customCards: null
            });

            // Formulários e Pesquisa
            const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
            const [mimoTitle, setMimoTitle] = useState('');
            const [selectedChallengeIcon, setSelectedChallengeIcon] = useState('Flame');
            const [wishlistInput, setWishlistInput] = useState('');
            const [wishlistWho, setWishlistWho] = useState('user1');
            const [transactionPhoto, setTransactionPhoto] = useState(null);
            const [dateFormIsYearly, setDateFormIsYearly] = useState(true);
            const [searchTerm, setSearchTerm] = useState(''); // Pesquisa de gastos
            const [newNote, setNewNote] = useState(''); // Novo recado
            
            // Form Parcelamento
            const [isInstallment, setIsInstallment] = useState(false);
            const [installmentsCount, setInstallmentsCount] = useState(2);

            const fileInputRef = useRef(null);
            const receiptInputRef = useRef(null);

            const user1Name = settings.user1Name || "Pessoa 1";
            const user2Name = settings.user2Name || "Pessoa 2";

            // Categorias e Cartões (Dinâmicos ou Padrão)
            const categories = settings.customCategories || ['Alimentação', 'Contas', 'Transporte', 'Viagem', 'Lazer', 'Saúde'];
            const cards = settings.customCards || [
                { id: 'nubank', name: 'Nubank' },
                { id: 'santander', name: 'Santander' },
                { id: 'mercadopago', name: 'Mercado Pago' },
                { id: 'caju', name: 'Caju' },
                { id: 'pix', name: 'Pix / Dinheiro' },
            ];

            // 1. Autenticação Segura
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Erro na Autenticação:", err);
                        setAuthError("Erro de comunicação com a base de dados. Verifique as regras do Firebase.");
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // 2. Sincronização de Dados com o Firestore
            useEffect(() => {
                if (!user) return; 
                
                const collections = [
                    { name: 'transactions', setter: setTransactions },
                    { name: 'goals', setter: setGoals },
                    { name: 'subscriptions', setter: setSubscriptions },
                    { name: 'specialDates', setter: setSpecialDates },
                    { name: 'challenges', setter: setChallenges },
                    { name: 'wishlist', setter: setWishlist },
                    { name: 'budgets', setter: setBudgets },
                    { name: 'notes', setter: setNotes }
                ];

                const unsubs = collections.map(col => {
                    const q = collection(db, 'artifacts', appDatabaseId, 'public', 'data', col.name);
                    return onSnapshot(q, 
                        (snap) => {
                            const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                            col.setter(data);
                        }, 
                        (err) => console.error(`Erro ao carregar ${col.name}:`, err)
                    );
                });

                const unsubSet = onSnapshot(doc(db, 'artifacts', appDatabaseId, 'public', 'data', 'settings', 'profile'), 
                    (snap) => {
                        if (snap.exists()) setSettings(prev => ({ ...prev, ...snap.data() }));
                    }, 
                    (err) => console.error("Erro configurações:", err)
                );

                return () => { unsubs.forEach(u => u()); unsubSet(); };
            }, [user]);

            // --- FUNÇÕES DE BDD ---
            const saveDoc = async (colName, data) => {
                try { await addDoc(collection(db, 'artifacts', appDatabaseId, 'public', 'data', colName), { ...data, createdAt: serverTimestamp() }); } 
                catch (err) { console.error(`Erro ao salvar:`, err); }
            };

            const delDoc = async (colName, id) => {
                try { await deleteDoc(doc(db, 'artifacts', appDatabaseId, 'public', 'data', colName, id)); } 
                catch (err) { console.error(`Erro ao deletar:`, err); }
            };

            const updDoc = async (colName, id, data) => {
                try { await updateDoc(doc(db, 'artifacts', appDatabaseId, 'public', 'data', colName, id), data); } 
                catch (err) { console.error(`Erro ao atualizar:`, err); }
            };

            // Cálculos Derivados
            const currentMonthTransactions = useMemo(() => {
                return (transactions || []).filter(t => t?.date?.startsWith(selectedMonth));
            }, [transactions, selectedMonth]);

            const stats = useMemo(() => {
                let u1PS = 0; let u2PS = 0; let u1M = 0; let u2M = 0;
                currentMonthTransactions.forEach(t => {
                    const a = parseFloat(t.amount) || 0;
                    if (t.split === 'shared') { if(t.paidBy === 'user1') u1PS += a; else u2PS += a; }
                    else if (t.split === 'mimo') { if(t.paidBy === 'user1') u1M += a; else u2M += a; }
                });

                (subscriptions || []).forEach(s => {
                    const a = parseFloat(s.amount) || 0;
                    if (s.split === 'shared') { if(s.paidBy === 'user1') u1PS += a; else u2PS += a; }
                });

                const shared = u1PS + u2PS;
                return { total: shared, u1PS, u2PS, u1Bal: (u1PS - (shared/2)) + u1M - u2M, u2Bal: (u2PS - (shared/2)) + u2M - u1M };
            }, [currentMonthTransactions, subscriptions]);

            const categoryTotals = useMemo(() => {
                const totals = {};
                currentMonthTransactions.forEach(t => {
                    totals[t.category] = (totals[t.category] || 0) + (parseFloat(t.amount) || 0);
                });
                return Object.entries(totals).sort((a,b) => b[1] - a[1]); // array of [category, amount]
            }, [currentMonthTransactions]);

            const filteredTransactions = useMemo(() => {
                if (!searchTerm.trim()) return currentMonthTransactions.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
                const term = searchTerm.toLowerCase();
                return currentMonthTransactions.filter(t => 
                    t.title?.toLowerCase().includes(term) || 
                    t.category?.toLowerCase().includes(term) ||
                    cards.find(c => c.id === t.cardId)?.name?.toLowerCase().includes(term)
                ).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
            }, [currentMonthTransactions, searchTerm, cards]);

            const dates = useMemo(() => {
                const today = new Date(); today.setHours(0,0,0,0);
                return (specialDates || []).map(d => {
                    let target = new Date(d.date ? `${d.date}T00:00:00` : today);
                    if (isNaN(target)) target = new Date();
                    if(d.isYearly){ target.setFullYear(today.getFullYear()); if(target < today) target.setFullYear(today.getFullYear() + 1); }
                    return { ...d, days: Math.max(0, Math.ceil((target - today)/(1000*60*60*24))), next: target };
                }).sort((a,b) => a.days - b.days);
            }, [specialDates]);

            // Formatação
            const format = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(parseFloat(v) || 0);
            
            const formatDateSafe = (dateString) => {
                if (!dateString) return '';
                const d = new Date(dateString);
                return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', {timeZone: 'UTC'});
            };

            const getMonthName = (yyyyMM) => {
                if (!yyyyMM) return '';
                const [y, m] = yyyyMM.split('-');
                const d = new Date(y, m - 1, 1);
                return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            };

            const getCategoryIcon = (cat) => {
                const icons = { Alimentação: <Utensils/>, Contas: <Zap/>, Transporte: <Car/>, Viagem: <Plane/>, Lazer: <Heart/>, Saúde: <Heart/> };
                return React.cloneElement(icons[cat] || <Tag/>, { className: "w-5 h-5 text-pink-400" });
            };

            // Ações Principais
            const handlePhotoUpload = async (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const compressedBase64 = await compressImage(file);
                    if (type === 'profile') {
                        await setDoc(doc(db, 'artifacts', appDatabaseId, 'public', 'data', 'settings', 'profile'), { ...settings, couplePhoto: compressedBase64 }, {merge:true});
                    }
                    else if (type === 'newTransaction') {
                        setTransactionPhoto(compressedBase64);
                    }
                } catch (err) { console.error("Erro ao processar imagem", err); }
            };

            const handleSaveTransaction = async (e) => {
                e.preventDefault(); 
                const fd = new FormData(e.target);
                const totalAmount = parseCurrency(fd.get('amount'));
                const qty = isInstallment ? parseInt(installmentsCount) : 1;
                const amountPerInst = totalAmount / qty;
                
                const [yyyy, mm, dd] = fd.get('date').split('-');
                const groupId = Date.now().toString(); // Identificador comum para parcelas

                for(let i = 0; i < qty; i++) {
                    let m = parseInt(mm) + i;
                    let y = parseInt(yyyy);
                    while(m > 12) { m -= 12; y += 1; }
                    const dateStr = `${y}-${String(m).padStart(2,'0')}-${dd}`;

                    await saveDoc('transactions', {
                        title: fd.get('title'),
                        amount: amountPerInst,
                        date: dateStr,
                        category: fd.get('category'), 
                        paidBy: fd.get('paidBy'), 
                        split: fd.get('split'), 
                        cardId: fd.get('cardId'), 
                        photo: transactionPhoto,
                        // Info de parcelamento
                        groupId: qty > 1 ? groupId : null,
                        installmentIndex: qty > 1 ? i + 1 : null,
                        totalInstallments: qty > 1 ? qty : null
                    });
                }
                
                setIsAddModalOpen(false); 
                setTransactionPhoto(null);
                setIsInstallment(false);
                setInstallmentsCount(2);
            };

            const handleDeleteTransactionProcess = async (mode) => {
                if(!txToDelete) return;
                
                if(mode === 'single' || !txToDelete.groupId) {
                    await delDoc('transactions', txToDelete.id);
                } else if (mode === 'all') {
                    // Busca todas do mesmo grupo e apaga
                    const toDelete = transactions.filter(t => t.groupId === txToDelete.groupId);
                    for (const t of toDelete) {
                        await delDoc('transactions', t.id);
                    }
                }
                setTxToDelete(null);
            };

            const handleSaveSettings = async (e) => {
                e.preventDefault(); const fd = new FormData(e.target);
                const newSettings = { 
                    user1Name: fd.get('user1Name'), 
                    user2Name: fd.get('user2Name'), 
                    startDate: fd.get('startDate') 
                };
                await setDoc(doc(db, 'artifacts', appDatabaseId, 'public', 'data', 'settings', 'profile'), { ...settings, ...newSettings }, {merge:true});
                setIsSettingsModalOpen(false);
            };

            const handleAddNote = async (e) => {
                e.preventDefault();
                if(!newNote.trim()) return;
                const author = stats.u1Bal > 0 ? 'user1' : 'user2'; // Quem deve menos escreve rosa? Apenas uma brincadeira, vou usar quem envia baseado no clique (criado botões de quem envia).
            };

            // Telas de Erro/Loading
            if (authError) return (
                <div className="flex flex-col h-screen items-center justify-center bg-rose-50 p-6 text-center">
                    <AlertCircle className="w-16 h-16 text-rose-500 mb-4" />
                    <h2 className="text-xl font-black text-rose-600 mb-2">Acesso Negado</h2>
                    <p className="text-slate-600 font-medium">{authError}</p>
                </div>
            );

            return (
                <div className="fixed inset-0 w-full h-[100dvh] bg-pink-50 flex justify-center font-sans text-slate-800 select-none overflow-hidden sm:p-4 sm:items-center animate-in fade-in duration-500">
                    <div className="w-full h-full sm:h-[95vh] max-w-full sm:max-w-[420px] bg-white flex flex-col relative shadow-2xl sm:rounded-[2.5rem] sm:border-[6px] sm:border-pink-200 overflow-hidden">
                        
                        <header className="shrink-0 bg-gradient-to-r from-pink-400 to-rose-300 text-white p-6 pb-8 z-20 border-b-4 border-pink-200">
                            <div className="flex justify-between items-center">
                                <div className="flex flex-col">
                                    <h1 className="text-2xl font-bold flex items-center gap-2 tracking-tight">
                                        <Flower className="w-6 h-6 fill-white" /> Nosso Bolso <Sparkles className="w-4 h-4 text-yellow-200" />
                                    </h1>
                                    <button onClick={() => setIsSettingsModalOpen(true)} className="flex items-center gap-1 text-xs mt-1 text-pink-100 hover:text-white transition-colors">
                                        <Settings className="w-3 h-3" /> Configurações
                                    </button>
                                </div>
                                <div className="relative cursor-pointer active:scale-95 transition-transform" onClick={() => fileInputRef.current?.click()}>
                                    <div className="w-12 h-12 rounded-full overflow-hidden border-2 border-white/60 bg-white/30 flex items-center justify-center shadow-inner">
                                        {settings?.couplePhoto ? <img src={settings.couplePhoto} className="w-full h-full object-cover" alt="Perfil" /> : <Users className="text-white w-6 h-6" />}
                                    </div>
                                    <div className="absolute -bottom-1 -right-1 bg-pink-500 rounded-full p-1 border-2 border-white"><Camera className="w-3 h-3 text-white" /></div>
                                </div>
                                <input type="file" ref={fileInputRef} onChange={(e) => handlePhotoUpload(e, 'profile')} className="hidden" accept="image/*" />
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto hide-scrollbar p-4 pb-28 -mt-4 bg-white z-10 pt-8 rounded-t-[1.5rem] flex flex-col gap-6">
                            
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6 animate-in fade-in duration-300">
                                    
                                    <div className="flex justify-between items-center bg-white p-2 rounded-full border border-pink-100 shadow-sm">
                                        <button onClick={() => { const [y, m] = selectedMonth.split('-'); const d = new Date(y, m-2); setSelectedMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }} className="p-3 bg-pink-50 rounded-full text-pink-500 active:scale-90"><ChevronLeft/></button>
                                        <span className="font-bold capitalize text-slate-700">{getMonthName(selectedMonth)}</span>
                                        <button onClick={() => { const [y, m] = selectedMonth.split('-'); const d = new Date(y, m); setSelectedMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }} className="p-3 bg-pink-50 rounded-full text-pink-500 active:scale-90"><ChevronRight/></button>
                                    </div>

                                    {/* MURAL DE RECADOS */}
                                    <div className="bg-yellow-50/60 border border-yellow-100 p-4 rounded-[2rem] shadow-sm">
                                        <h2 className="text-sm font-bold mb-3 text-amber-600 flex items-center gap-2"><MessageSquare className="w-4 h-4"/> Mural de Lembretes</h2>
                                        <div className="space-y-2 mb-3 max-h-32 overflow-y-auto hide-scrollbar">
                                            {(notes || []).length === 0 && <p className="text-xs text-amber-500/50 text-center italic">Nenhum recado ainda.</p>}
                                            {(notes || []).sort((a,b)=>b.createdAt - a.createdAt).slice(0,5).map(n => (
                                                <div key={n.id} className="bg-white p-2 px-3 rounded-2xl shadow-sm text-xs font-medium text-slate-700 relative group border border-yellow-50">
                                                    <span className="font-bold text-amber-500">{n.author === 'user1' ? user1Name : user2Name}:</span> {n.text}
                                                    <button onClick={()=>delDoc('notes', n.id)} className="absolute right-2 top-2 opacity-0 group-hover:opacity-100 text-rose-300"><X className="w-3 h-3"/></button>
                                                </div>
                                            ))}
                                        </div>
                                        <form onSubmit={(e) => { e.preventDefault(); if(!newNote.trim()) return; saveDoc('notes', { text: newNote, author: wishlistWho }); setNewNote(''); }} className="flex gap-2">
                                            <button type="button" onClick={()=>setWishlistWho('user1')} className={`w-8 h-8 rounded-full text-[10px] font-black shrink-0 transition-all ${wishlistWho==='user1'?'bg-pink-500 text-white':'bg-white text-slate-400'}`}>{user1Name[0]}</button>

                                    </div>
                                    <form onSubmit={handleSaveSettings} className="space-y-4">
                                        <div className="bg-slate-50 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 block uppercase mb-1">Pessoa 1</label><input required name="user1Name" defaultValue={user1Name} className="w-full bg-transparent font-bold text-slate-800 outline-none" /></div>
                                        <div className="bg-slate-50 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 block uppercase mb-1">Pessoa 2</label><input required name="user2Name" defaultValue={user2Name} className="w-full bg-transparent font-bold text-slate-800 outline-none" /></div>
                                        <div className="bg-slate-50 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 block uppercase mb-1">Data de Início</label><input required name="startDate" type="date" defaultValue={settings.startDate} className="w-full bg-transparent font-bold text-slate-800 outline-none" /></div>
                                        
                                        {/* Secção Avançada (Categorias/Cartões omitidos no UI simples, mas prontos na lógica. Apenas texto para evitar poluir) */}
                                        <div className="p-4 bg-sky-50 rounded-3xl border border-sky-100">
                                            <p className="text-[10px] font-black text-sky-500 uppercase flex items-center gap-1 mb-2"><Layers className="w-3 h-3"/> Avançado (Em Breve)</p>
                                            <p className="text-xs text-sky-700/70 font-medium leading-tight">As tuas categorias e cartões personalizados estão gravados com segurança. Um gestor completo de categorias será adicionado em breve.</p>
                                        </div>

                                        <button className="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-black py-5 rounded-3xl shadow-xl mt-4">Gravar Alterações</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Modal NOVO REGISTO (Com Parcelamento) */}
                        {isAddModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 max-h-[95dvh] overflow-y-auto hide-scrollbar shadow-2xl">
                                    <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                                    <div className="flex justify-between items-center mb-6"><h3 className="text-2xl font-black text-pink-600 tracking-tighter">Novo Registo 🌸</h3><button onClick={() => setIsAddModalOpen(false)} className="p-2 bg-slate-100 rounded-full text-slate-400"><X className="w-5 h-5"/></button></div>
                                    <form onSubmit={handleSaveTransaction} className="space-y-4">
                                        <div className="bg-slate-50 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 block uppercase mb-1">Descrição</label><input required name="title" className="w-full bg-transparent font-bold outline-none" placeholder="Ex: Jantar fofo..." /></div>
                                        
                                        {/* Toggle Parcelamento */}
                                        <div className="bg-pink-50/50 p-4 rounded-3xl border border-pink-100 flex items-center justify-between">
                                            <span className="text-[10px] font-black text-pink-500 uppercase">É parcelado?</span>
                                            <label className="relative inline-flex items-center cursor-pointer">
                                                <input type="checkbox" checked={isInstallment} onChange={(e) => setIsInstallment(e.target.checked)} className="sr-only peer" />
                                                <div className="w-11 h-6 bg-pink-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-pink-500"></div>
                                            </label>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-50 p-4 rounded-3xl">
                                                <label className="text-[10px] font-black text-slate-400 block uppercase mb-1">{isInstallment ? 'Valor Total' : 'Valor'}</label>
                                                <input required name="amount" type="text" inputMode="decimal" className="w-full bg-transparent font-black outline-none" placeholder="0,00" />
                                            </div>
                                            {isInstallment ? (
                                                <div className="bg-pink-100 p-4 rounded-3xl border border-pink-200">
                                                    <label className="text-[10px] font-black text-pink-600 block uppercase mb-1">Quantas Vezes?</label>
                                                    <input required type="number" min="2" max="48" value={installmentsCount} onChange={(e)=>setInstallmentsCount(e.target.value)} className="w-full bg-transparent font-black text-pink-700 outline-none" placeholder="Ex: 3" />
                                                </div>
                                            ) : (
                                                <div className="bg-slate-50 p-4 rounded-3xl">
                                                    <label className="text-[10px] font-black text-slate-400 block uppercase mb-1">Data</label>
                                                    <input required name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-transparent font-bold outline-none" />
                                                </div>
                                            )}
                                        </div>

                                        {/* Se for parcelado, precisa na mesma de uma data de início */}
                                        {isInstallment && (
                                            <div className="bg-slate-50 p-4 rounded-3xl">
                                                <label className="text-[10px] font-black text-slate-400 block uppercase mb-1">Data da 1ª Parcela</label>
                                                <input required name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-transparent font-bold outline-none" />
                                            </div>
                                        )}

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-50 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 mb-1 uppercase">Forma</label><select name="cardId" className="w-full bg-transparent font-bold outline-none">{cards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                                            <div className="bg-slate-50 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 mb-1 uppercase">Categoria</label><select name="category" className="w-full bg-transparent font-bold outline-none">{categories.map(c => <option key={c}>{c}</option>)}</select></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4 pb-4">
                                            <div className="bg-slate-50 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 mb-1 uppercase">Quem Pagou?</label><select name="paidBy" className="w-full bg-transparent font-bold outline-none"><option value="user1">{user1Name}</option><option value="user2">{user2Name}</option></select></div>
                                            <div className="bg-slate-50 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 mb-1 uppercase">Divisão</label><select name="split" className="w-full bg-transparent font-bold outline-none"><option value="shared">Casal (50/50)</option><option value="individual">Apenas Meu</option></select></div>
                                        </div>

                                        <div className="bg-pink-50 p-4 rounded-3xl flex items-center justify-between cursor-pointer border-2 border-dashed border-pink-200" onClick={() => receiptInputRef.current?.click()}>
                                            <span className="text-pink-500 font-black text-xs flex items-center gap-2 uppercase"><ImagePlus className="w-5 h-5"/> {transactionPhoto ? 'Trocar Foto' : 'Guardar Lembrança'}</span>
                                            {transactionPhoto && <img src={transactionPhoto} className="w-10 h-10 rounded-xl object-cover shadow-md border-2 border-white"/>}
                                            <input type="file" ref={receiptInputRef} onChange={(e) => handlePhotoUpload(e, 'newTransaction')} className="hidden" accept="image/*" />
                                        </div>

                                        <button className="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-black py-5 rounded-3xl shadow-xl mt-2">Guardar no Bolso <Sparkles className="w-5 h-5"/></button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {isAddBudgetModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 shadow-2xl">
                                    <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                                    <h3 className="text-xl font-black text-pink-600 mb-6 flex items-center gap-2"><AlertCircle className="w-6 h-6"/> Novo Alerta</h3>
                                    <form onSubmit={async e => { e.preventDefault(); const fd = new FormData(e.target); await saveDoc('budgets', { category: fd.get('category'), limit: parseCurrency(fd.get('limit')) }); setIsAddBudgetModalOpen(false); }} className="space-y-4">
                                        <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Categoria</label><select name="category" className="w-full bg-transparent font-bold outline-none">{categories.map(c => <option key={c}>{c}</option>)}</select></div>
                                        <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Limite Máximo (€)</label><input name="limit" type="text" inputMode="decimal" required placeholder="Ex: 300,00" className="w-full bg-transparent font-black outline-none" /></div>
                                        <button className="w-full bg-pink-500 text-white font-black py-4 rounded-3xl shadow-lg mt-4">Ativar Alerta 🚨</button>
                                        <button type="button" onClick={()=>setIsAddBudgetModalOpen(false)} className="w-full text-slate-400 font-bold py-2">Cancelar</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {isAddChallengeModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 shadow-2xl">
                                    <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                                    <h3 className="text-xl font-black text-purple-600 mb-6 flex items-center gap-2"><Trophy className="w-6 h-6"/> Novo Desafio</h3>
                                    <form onSubmit={async e => { e.preventDefault(); const fd = new FormData(e.target); await saveDoc('challenges', { title: fd.get('title'), target: parseInt(fd.get('target'))||1, progress: 0, icon: selectedChallengeIcon }); setIsAddChallengeModalOpen(false); }} className="space-y-4">
                                        <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">O que faremos?</label><input name="title" required placeholder="Ex: Sem IFood 🍕" className="w-full bg-transparent font-bold outline-none" /></div>
                                        <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Quantas vezes/dias?</label><input name="target" type="number" required placeholder="Alvo (ex: 7)" className="w-full bg-transparent font-black outline-none" /></div>
                                        <div className="flex gap-4">
                                            <button type="button" onClick={() => setSelectedChallengeIcon('Flame')} className={`flex-1 p-4 rounded-2xl border-2 transition-all shadow-sm ${selectedChallengeIcon==='Flame'?'bg-purple-500 border-purple-500 text-white':'bg-slate-50 border-transparent text-slate-400'}`}><Flame className="mx-auto"/></button>
                                            <button type="button" onClick={() => setSelectedChallengeIcon('PiggyBank')} className={`flex-1 p-4 rounded-2xl border-2 transition-all shadow-sm ${selectedChallengeIcon==='PiggyBank'?'bg-purple-500 border-purple-500 text-white':'bg-slate-50 border-transparent text-slate-400'}`}><PiggyBank className="mx-auto"/></button>
                                        </div>
                                        <button className="w-full bg-purple-500 text-white font-black py-4 rounded-3xl shadow-lg mt-4">Lançar Desafio 🚀</button>
                                        <button type="button" onClick={()=>setIsAddChallengeModalOpen(false)} className="w-full text-slate-400 font-bold py-2">Desistir</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {isAddSubModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 shadow-2xl">
                                    <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                                    <h3 className="text-xl font-black text-pink-600 mb-6 flex items-center gap-2"><Repeat className="w-5 h-5"/> Nova Despesa Fixa</h3>
                                    <form onSubmit={async e => { e.preventDefault(); const fd = new FormData(e.target); await saveDoc('subscriptions', { name: fd.get('name'), amount: parseCurrency(fd.get('amount')), paidBy: fd.get('paidBy'), split: fd.get('split') }); setIsAddSubModalOpen(false); }} className="space-y-4">
                                        <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Nome</label><input name="name" required placeholder="Netflix, Aluguer..." className="w-full bg-transparent font-bold outline-none" /></div>
                                        <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Valor Mensal</label><input name="amount" type="text" inputMode="decimal" required placeholder="0,00" className="w-full bg-transparent font-black outline-none" /></div>
                                        <div className="grid grid-cols-2 gap-4 pb-4">
                                            <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Quem?</label><select name="paidBy" className="w-full bg-transparent font-bold outline-none"><option value="user1">{user1Name}</option><option value="user2">{user2Name}</option></select></div>
                                            <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Divisão</label><select name="split" className="w-full bg-transparent font-bold outline-none"><option value="shared">Casal</option><option value="individual">Individual</option></select></div>
                                        </div>
                                        <button className="w-full bg-pink-500 text-white font-black py-4 rounded-3xl shadow-lg">Guardar Fixa 🎀</button>
                                        <button type="button" onClick={()=>setIsAddSubModalOpen(false)} className="w-full text-slate-400 font-bold py-2">Cancelar</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {isAddDateModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 shadow-2xl">
                                    <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                                    <h3 className="text-xl font-black text-pink-600 mb-6 flex items-center gap-2"><CalendarDays className="w-6 h-6"/> Momento Inesquecível</h3>
                                    <form onSubmit={async e => { e.preventDefault(); const fd = new FormData(e.target); await saveDoc('specialDates', { title: fd.get('title'), date: fd.get('date'), isYearly: dateFormIsYearly }); setIsAddDateModalOpen(false); }} className="space-y-4">
                                        <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">O que comemoramos?</label><input name="title" required placeholder="Ex: Nosso Aniversário" className="w-full bg-transparent font-bold outline-none" /></div>
                                        <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Qual a Data?</label><input name="date" type="date" required className="w-full bg-transparent font-bold outline-none" /></div>
                                        <div className="flex gap-2">
                                            <button type="button" onClick={()=>setDateFormIsYearly(true)} className={`flex-1 py-4 rounded-2xl font-black transition-all shadow-sm ${dateFormIsYearly?'bg-pink-500 text-white':'bg-slate-50 text-slate-400'}`}>Todo Ano ✨</button>
                                            <button type="button" onClick={()=>setDateFormIsYearly(false)} className={`flex-1 py-4 rounded-2xl font-black transition-all shadow-sm ${!dateFormIsYearly?'bg-pink-500 text-white':'bg-slate-50 text-slate-400'}`}>Uma Vez 💖</button>
                                        </div>
                                        <button className="w-full bg-pink-600 text-white font-black py-4 rounded-3xl shadow-lg mt-4">Eternizar Data</button>
                                        <button type="button" onClick={()=>setIsAddDateModalOpen(false)} className="w-full text-slate-400 font-bold py-2">Cancelar</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {showMimoModal && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                                <div className="bg-white w-full max-w-sm rounded-[3rem] p-6 text-center shadow-2xl border-4 border-pink-100">
                                    <Gift className="w-12 h-12 text-pink-500 mx-auto mb-4" />
                                    <h3 className="text-xl font-black text-pink-600 mb-2 tracking-tighter">Pagar com Mimo 🎁</h3>
                                    <form onSubmit={handlePayWithMimoSubmit} className="space-y-4 text-left">
                                        <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 uppercase block mb-1">Qual o Mimo?</label><input required name="title" value={mimoTitle} onChange={e=>setMimoTitle(e.target.value)} placeholder="Ex: Pizza dos sonhos..." className="w-full bg-transparent font-bold outline-none" /></div>
                                        <div className="bg-slate-50 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 uppercase block mb-1">Valor Estimado</label><input required name="amount" type="text" inputMode="decimal" placeholder="0,00" className="w-full bg-transparent font-black outline-none" /></div>
                                        <button className="w-full bg-pink-500 text-white font-black py-4 rounded-3xl shadow-lg">Quitar Dívida com Amor 💖</button>
                                        <button type="button" onClick={()=>setShowMimoModal(false)} className="w-full text-slate-400 font-bold py-2 text-sm">Talvez depois</button>
                                    </form>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
