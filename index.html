    <script type="text/babel" data-type="module" data-presets="react">
        // Importando React
        import React, { useState, useMemo, useRef, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        // Importando Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        // Importando Ícones
        import { 
            Home, ReceiptText, Target, Plus, Plane, CreditCard, 
            ShoppingCart, Utensils, Zap, Car, Heart, TrendingUp, X, 
            Users, ChevronLeft, ChevronRight, Repeat, Gift, 
            Flower, Sparkles, Camera, CalendarHeart, Clock, CalendarDays, 
            Trash2, Pencil, AlertCircle, ImagePlus, Flame, PiggyBank, 
            CheckCircle2, Circle, ListTodo, Trophy, Settings, Search,
            MessageSquare, PieChart, Tag, Layers, Download, Lock, Unlock, Moon, Sun, Wallet, Map
        } from 'https://esm.sh/lucide-react@0.344.0?bundle';

        // --- CONFIGURAÇÃO DO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDyWO6W5AEscA061bwG91u68TfX2FVycek",
            authDomain: "nosso-bolso-d88a0.firebaseapp.com",
            projectId: "nosso-bolso-d88a0",
            storageBucket: "nosso-bolso-d88a0.firebasestorage.app",
            messagingSenderId: "101766584028",
            appId: "1:101766584028:web:f97ced5cc5a84170e98619"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appDatabaseId = "nosso-bolso-v2";

        // --- COMPRESSÃO DE IMAGEM ---
        const compressImage = (file, maxWidth = 800) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(maxWidth / img.width, 1);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        // --- UTILITÁRIO PARA MOEDA ---
        const parseCurrency = (val) => {
            if (!val) return 0;
            return parseFloat(String(val).replace(',', '.')) || 0;
        };

        const chartColors = ['bg-pink-400', 'bg-purple-400', 'bg-sky-400', 'bg-emerald-400', 'bg-amber-400', 'bg-rose-500', 'bg-indigo-400', 'bg-fuchsia-400', 'bg-teal-400'];

        function App() {
            const [user, setUser] = useState(null);
            const [authError, setAuthError] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Theme Mode
            const [isDark, setIsDark] = useState(() => localStorage.getItem('theme') === 'dark');

            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [isDark]);

            // Modais
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isAddChallengeModalOpen, setIsAddChallengeModalOpen] = useState(false);
            const [isAddSubModalOpen, setIsAddSubModalOpen] = useState(false);
            const [isAddDateModalOpen, setIsAddDateModalOpen] = useState(false);
            const [isAddBudgetModalOpen, setIsAddBudgetModalOpen] = useState(false);
            const [showMimoModal, setShowMimoModal] = useState(false);
            const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
            const [isAddSavingsModalOpen, setIsAddSavingsModalOpen] = useState(false);
            const [isAddScheduleModalOpen, setIsAddScheduleModalOpen] = useState(false);
            const [fundPrompt, setFundPrompt] = useState(null); 
            
            const [txToDelete, setTxToDelete] = useState(null);
            const [editingSub, setEditingSub] = useState(null);

            // Dados Sincronizados
            const [transactions, setTransactions] = useState([]);
            const [goals, setGoals] = useState([]);
            const [subscriptions, setSubscriptions] = useState([]);
            const [specialDates, setSpecialDates] = useState([]);
            const [challenges, setChallenges] = useState([]);
            const [wishlist, setWishlist] = useState([]);
            const [budgets, setBudgets] = useState([]);
            const [notes, setNotes] = useState([]); 
            const [savings, setSavings] = useState([]); 
            const [closedMonths, setClosedMonths] = useState([]); 
            const [schedule, setSchedule] = useState([]); // Roteiro / Cronograma Anual
            
            const [settings, setSettings] = useState({ 
                user1Name: 'Samile', 
                user2Name: 'Cristiamberg', 
                couplePhoto: null, 
                startDate: '2023-06-12',
                customCategories: null,
                customCards: null
            });

            // Formulários e Pesquisa
            const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
            const [mimoTitle, setMimoTitle] = useState('');
            const [selectedChallengeIcon, setSelectedChallengeIcon] = useState('Flame');
            const [wishlistInput, setWishlistInput] = useState('');
            const [wishlistWho, setWishlistWho] = useState('user1');
            const [transactionPhoto, setTransactionPhoto] = useState(null);
            const [editingTxIdForPhoto, setEditingTxIdForPhoto] = useState(null);
            const [dateFormFrequency, setDateFormFrequency] = useState('yearly');
            const [searchTerm, setSearchTerm] = useState(''); 
            const [newNote, setNewNote] = useState(''); 
            
            // Gestão de Categorias e Cartões UI
            const [newCatInput, setNewCatInput] = useState('');
            const [newCardInput, setNewCardInput] = useState('');
            
            // Form Parcelamento
            const [isInstallment, setIsInstallment] = useState(false);
            const [installmentsCount, setInstallmentsCount] = useState(2);

            const fileInputRef = useRef(null);
            const receiptInputRef = useRef(null);
            const editPhotoInputRef = useRef(null);

            const user1Name = settings.user1Name || "Pessoa 1";
            const user2Name = settings.user2Name || "Pessoa 2";

            // Categorias e Cartões (Dinâmicos ou Padrão)
            const categories = settings.customCategories || ['Alimentação', 'Contas', 'Transporte', 'Viagem', 'Lazer', 'Saúde'];
            const cards = settings.customCards || [
                { id: 'nubank', name: 'Nubank' },
                { id: 'santander', name: 'Santander' },
                { id: 'mercadopago', name: 'Mercado Pago' },
                { id: 'caju', name: 'Caju' },
                { id: 'pix', name: 'Pix / Dinheiro' },
            ];

            // 1. Autenticação Segura
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Erro na Autenticação:", err);
                        setAuthError("Erro de comunicação com a base de dados. Verifique as regras do Firebase.");
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // 2. Sincronização de Dados com o Firestore
            useEffect(() => {
                if (!user) return; 
                
                const collections = [
                    { name: 'transactions', setter: setTransactions },
                    { name: 'subscriptions', setter: setSubscriptions },
                    { name: 'specialDates', setter: setSpecialDates },
                    { name: 'challenges', setter: setChallenges },
                    { name: 'wishlist', setter: setWishlist },
                    { name: 'budgets', setter: setBudgets },
                    { name: 'notes', setter: setNotes },
                    { name: 'savings', setter: setSavings },
                    { name: 'closedMonths', setter: setClosedMonths },
                    { name: 'schedule', setter: setSchedule }
                ];

                const unsubs = collections.map(col => {
                    const q = collection(db, 'artifacts', appDatabaseId, 'public', 'data', col.name);
                    return onSnapshot(q, 
                        (snap) => {
                            const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                            col.setter(data);
                        }, 
                        (err) => console.error(`Erro ao carregar ${col.name}:`, err)
                    );
                });

                const unsubSet = onSnapshot(doc(db, 'artifacts', appDatabaseId, 'public', 'data', 'settings', 'profile'), 
                    (snap) => {
                        if (snap.exists()) setSettings(prev => ({ ...prev, ...snap.data() }));
                    }, 
                    (err) => console.error("Erro configurações:", err)
                );

                return () => { unsubs.forEach(u => u()); unsubSet(); };
            }, [user]);

            // --- FUNÇÕES DE BDD ---
            const saveDoc = async (colName, data, id = null) => {
                try { 
                    if(id) {
                        await setDoc(doc(db, 'artifacts', appDatabaseId, 'public', 'data', colName, id), { ...data, createdAt: serverTimestamp() });
                    } else {
                        await addDoc(collection(db, 'artifacts', appDatabaseId, 'public', 'data', colName), { ...data, createdAt: serverTimestamp() }); 
                    }
                } 
                catch (err) { console.error(`Erro ao salvar:`, err); }
            };

            const delDoc = async (colName, id) => {
                try { await deleteDoc(doc(db, 'artifacts', appDatabaseId, 'public', 'data', colName, id)); } 
                catch (err) { console.error(`Erro ao deletar:`, err); }
            };

            const updDoc = async (colName, id, data) => {
                try { await updateDoc(doc(db, 'artifacts', appDatabaseId, 'public', 'data', colName, id), data); } 
                catch (err) { console.error(`Erro ao atualizar:`, err); }
            };

            // Cálculos Derivados
            const currentMonthTransactions = useMemo(() => {
                return (transactions || []).filter(t => t?.date?.startsWith(selectedMonth));
            }, [transactions, selectedMonth]);

            const currentClosedMonth = useMemo(() => {
                return closedMonths.find(m => m.id === selectedMonth);
            }, [closedMonths, selectedMonth]);

            const stats = useMemo(() => {
                let u1PS = 0; let u2PS = 0; let u1M = 0; let u2M = 0;
                
                if (currentClosedMonth) {
                    return { 
                        total: currentClosedMonth.total, 
                        u1Bal: currentClosedMonth.u1Bal, 
                        u2Bal: currentClosedMonth.u2Bal,
                        isClosed: true
                    };
                }

                currentMonthTransactions.forEach(t => {
                    const a = parseFloat(t.amount) || 0;
                    if (t.split === 'shared') { if(t.paidBy === 'user1') u1PS += a; else u2PS += a; }
                    else if (t.split === 'mimo') { if(t.paidBy === 'user1') u1M += a; else u2M += a; }
                });

                (subscriptions || []).forEach(s => {
                    const isActive = (!s.startMonth || s.startMonth <= selectedMonth) && 
                                     (!s.endMonth || s.endMonth >= selectedMonth);
                    if (isActive) {
                        const a = parseFloat(s.amount) || 0;
                        if (s.split === 'shared') { if(s.paidBy === 'user1') u1PS += a; else u2PS += a; }
                    }
                });

                const shared = u1PS + u2PS;
                return { total: shared, u1PS, u2PS, u1Bal: (u1PS - (shared/2)) + u1M - u2M, u2Bal: (u2PS - (shared/2)) + u2M - u1M, isClosed: false };
            }, [currentMonthTransactions, subscriptions, selectedMonth, currentClosedMonth]);

            const categoryTotals = useMemo(() => {
                const totals = {};
                currentMonthTransactions.forEach(t => {
                    totals[t.category] = (totals[t.category] || 0) + (parseFloat(t.amount) || 0);
                });
                return Object.entries(totals).sort((a,b) => b[1] - a[1]);
            }, [currentMonthTransactions]);

            const filteredTransactions = useMemo(() => {
                if (!searchTerm.trim()) return currentMonthTransactions.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
                const term = searchTerm.toLowerCase();
                return currentMonthTransactions.filter(t => 
                    t.title?.toLowerCase().includes(term) || 
                    t.category?.toLowerCase().includes(term) ||
                    cards.find(c => c.id === t.cardId)?.name?.toLowerCase().includes(term)
                ).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
            }, [currentMonthTransactions, searchTerm, cards]);

            const dates = useMemo(() => {
                const today = new Date(); today.setHours(0,0,0,0);
                return (specialDates || []).map(d => {
                    let target = new Date(d.date ? `${d.date}T00:00:00` : today);
                    if (isNaN(target)) target = new Date();
                    
                    const freq = d.frequency || (d.isYearly ? 'yearly' : 'once');
                    
                    if (freq === 'monthly') {
                        let nextDate = new Date(today.getFullYear(), today.getMonth(), target.getDate());
                        if (nextDate < today) {
                            nextDate = new Date(today.getFullYear(), today.getMonth() + 1, target.getDate());
                        }
                        target = nextDate;
                    } else if (freq === 'yearly') {
                        target.setFullYear(today.getFullYear());
                        if (target < today) target.setFullYear(today.getFullYear() + 1);
                    }
                    
                    return { ...d, days: Math.max(0, Math.ceil((target - today)/(1000*60*60*24))), next: target };
                }).sort((a,b) => a.days - b.days);
            }, [specialDates]);

            const upcomingDates = useMemo(() => dates.filter(d => d.days <= 7 && d.days > 0), [dates]);

            // Formatação e Exportação
            const format = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(parseFloat(v) || 0);
            
            const formatDateSafe = (dateString) => {
                if (!dateString) return '';
                const d = new Date(dateString);
                return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', {timeZone: 'UTC'});
            };

            const getMonthName = (yyyyMM) => {
                if (!yyyyMM) return '';
                const [y, m] = yyyyMM.split('-');
                const d = new Date(y, m - 1, 1);
                return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            };

            const getCategoryIcon = (cat) => {
                const icons = { Alimentação: <Utensils/>, Contas: <Zap/>, Transporte: <Car/>, Viagem: <Plane/>, Lazer: <Heart/>, Saúde: <Heart/> };
                return React.cloneElement(icons[cat] || <Tag/>, { className: "w-5 h-5 text-pink-400 dark:text-pink-300" });
            };

            const exportToCSV = () => {
                const rows = [['Data', 'Descrição', 'Categoria', 'Valor', 'Pago Por', 'Divisão', 'Forma']];
                filteredTransactions.forEach(t => {
                    const payer = t.paidBy === 'user1' ? user1Name : user2Name;
                    const split = t.split === 'shared' ? 'Casal' : (t.split === 'mimo' ? 'Mimo' : 'Individual');
                    const cardName = cards.find(c => c.id === t.cardId)?.name || t.cardId;
                    rows.push([t.date, `"${t.title}"`, t.category, String(t.amount).replace('.', ','), payer, split, cardName]);
                });
                
                let csvContent = "\uFEFF" + rows.map(e => e.join(";")).join("\n"); 
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `NossoBolso_Gastos_${selectedMonth}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleCloseMonth = async () => {
                if (window.confirm(`Tem a certeza que deseja fechar o mês de ${getMonthName(selectedMonth)}? Isto irá gravar os saldos atuais e não poderão ser alterados.`)) {
                    await saveDoc('closedMonths', {
                        total: stats.total,
                        u1Bal: stats.u1Bal,
                        u2Bal: stats.u2Bal,
                        month: selectedMonth
                    }, selectedMonth);
                }
            };

            // Ações Principais
            const handlePhotoUpload = async (e, type, id = null) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const compressedBase64 = await compressImage(file);
                    if (type === 'profile') {
                        await setDoc(doc(db, 'artifacts', appDatabaseId, 'public', 'data', 'settings', 'profile'), { ...settings, couplePhoto: compressedBase64 }, {merge:true});
                    }
                    else if (type === 'newTransaction') {
                        setTransactionPhoto(compressedBase64);
                    }
                    else if (type === 'editTransaction' && id) { 
                        await updDoc('transactions', id, { photo: compressedBase64 }); 
                        setEditingTxIdForPhoto(null); 
                    }
                } catch (err) { console.error("Erro ao processar imagem", err); }
            };

            const handleSaveTransaction = async (e) => {
                e.preventDefault(); 
                const fd = new FormData(e.target);
                const totalAmount = parseCurrency(fd.get('amount'));
                const qty = isInstallment ? parseInt(installmentsCount) : 1;
                const amountPerInst = totalAmount / qty;
                
                const [yyyy, mm, dd] = fd.get('date').split('-');
                const groupId = Date.now().toString(); 

                for(let i = 0; i < qty; i++) {
                    let m = parseInt(mm) + i;
                    let y = parseInt(yyyy);
                    while(m > 12) { m -= 12; y += 1; }
                    const dateStr = `${y}-${String(m).padStart(2,'0')}-${dd}`;

                    await saveDoc('transactions', {
                        title: fd.get('title'),
                        amount: amountPerInst,
                        date: dateStr,
                        category: fd.get('category'), 
                        paidBy: fd.get('paidBy'), 
                        split: fd.get('split'), 
                        cardId: fd.get('cardId'), 
                        photo: transactionPhoto,
                        groupId: qty > 1 ? groupId : null,
                        installmentIndex: qty > 1 ? i + 1 : null,
                        totalInstallments: qty > 1 ? qty : null
                    });
                }
                
                setIsAddModalOpen(false); 
                setTransactionPhoto(null);
                setIsInstallment(false);
                setInstallmentsCount(2);
            };

            const handleSaveSubscription = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const data = {
                    name: fd.get('name'),
                    amount: parseCurrency(fd.get('amount')),
                    startMonth: fd.get('startMonth'),
                    endMonth: fd.get('endMonth') || null,
                    paidBy: fd.get('paidBy'),
                    split: fd.get('split')
                };
                if (editingSub) {
                    await updDoc('subscriptions', editingSub.id, data);
                } else {
                    await saveDoc('subscriptions', data);
                }
                setIsAddSubModalOpen(false);
                setEditingSub(null);
            };

            const handleSaveSettings = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const newSettings = {
                    ...settings,
                    user1Name: fd.get('user1Name') || 'Pessoa 1',
                    user2Name: fd.get('user2Name') || 'Pessoa 2',
                    startDate: fd.get('startDate')
                };
                setSettings(newSettings);
                await setDoc(doc(db, 'artifacts', appDatabaseId, 'public', 'data', 'settings', 'profile'), newSettings, {merge: true});
                setIsSettingsModalOpen(false);
            };

            const handleDeleteTransactionProcess = async (mode) => {
                if (!txToDelete) return;

                                                </div>
                                                <div className="flex gap-2">
                                                    <input value={newCatInput} onChange={e=>setNewCatInput(e.target.value)} placeholder="Nova Categoria..." className="flex-1 text-xs px-3 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white outline-none" />
                                                    <button type="button" onClick={()=>handleManageCategories('add', null, 'category')} className="bg-sky-500 text-white rounded-xl px-3 font-bold text-xs">Adicionar</button>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="text-[10px] font-black text-slate-400 block uppercase mb-2">Cartões / Formas de Pagamento</label>
                                                <div className="flex flex-wrap gap-2 mb-2">
                                                    {cards.map(c => (
                                                        <span key={c.id} className="bg-white dark:bg-slate-800 text-xs font-bold px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-600 flex items-center gap-1">
                                                            {c.name} <button type="button" onClick={()=>handleManageCategories('remove', c, 'card')} className="text-rose-400 ml-1"><X className="w-3 h-3"/></button>
                                                        </span>
                                                    ))}
                                                </div>
                                                <div className="flex gap-2">
                                                    <input value={newCardInput} onChange={e=>setNewCardInput(e.target.value)} placeholder="Novo Cartão..." className="flex-1 text-xs px-3 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 dark:text-white outline-none" />
                                                    <button type="button" onClick={()=>handleManageCategories('add', null, 'card')} className="bg-sky-500 text-white rounded-xl px-3 font-bold text-xs">Adicionar</button>
                                                </div>
                                            </div>
                                        </div>

                                        <button className="w-full bg-gradient-to-r from-pink-500 to-rose-500 dark:from-indigo-500 dark:to-purple-500 text-white font-black py-5 rounded-3xl shadow-xl mt-4">Gravar Alterações</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* Modal NOVO REGISTO (Com Parcelamento) */}
                        {isAddModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 max-h-[95dvh] overflow-y-auto hide-scrollbar shadow-2xl transition-colors">
                                    <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-600 rounded-full mx-auto mb-6"></div>
                                    <div className="flex justify-between items-center mb-6"><h3 className="text-2xl font-black text-pink-600 dark:text-pink-400 tracking-tighter">Novo Registo 🌸</h3><button onClick={() => setIsAddModalOpen(false)} className="p-2 bg-slate-100 dark:bg-slate-700 rounded-full text-slate-400 dark:text-slate-300"><X className="w-5 h-5"/></button></div>
                                    <form onSubmit={handleSaveTransaction} className="space-y-4">
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 block uppercase mb-1">Descrição</label><input required name="title" className="w-full bg-transparent dark:text-white font-bold outline-none" placeholder="Ex: Jantar fofo..." /></div>
                                        
                                        {/* Toggle Parcelamento */}
                                        <div className="bg-pink-50/50 dark:bg-slate-700/50 p-4 rounded-3xl border border-pink-100 dark:border-slate-600 flex items-center justify-between">
                                            <span className="text-[10px] font-black text-pink-500 dark:text-pink-300 uppercase">É parcelado?</span>
                                            <label className="relative inline-flex items-center cursor-pointer">
                                                <input type="checkbox" checked={isInstallment} onChange={(e) => setIsInstallment(e.target.checked)} className="sr-only peer" />
                                                <div className="w-11 h-6 bg-pink-200 dark:bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-pink-500 dark:peer-checked:bg-indigo-500"></div>
                                            </label>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-3xl">
                                                <label className="text-[10px] font-black text-slate-400 block uppercase mb-1">{isInstallment ? 'Valor Total' : 'Valor'}</label>
                                                <input required name="amount" type="text" inputMode="decimal" className="w-full bg-transparent dark:text-white font-black outline-none" placeholder="0,00" />
                                            </div>
                                            {isInstallment ? (
                                                <div className="bg-pink-100 dark:bg-indigo-900/30 p-4 rounded-3xl border border-pink-200 dark:border-indigo-800">
                                                    <label className="text-[10px] font-black text-pink-600 dark:text-indigo-300 block uppercase mb-1">Quantas Vezes?</label>
                                                    <input required type="number" min="2" max="48" value={installmentsCount} onChange={(e)=>setInstallmentsCount(e.target.value)} className="w-full bg-transparent font-black text-pink-700 dark:text-indigo-200 outline-none" placeholder="Ex: 3" />
                                                </div>
                                            ) : (
                                                <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-3xl">
                                                    <label className="text-[10px] font-black text-slate-400 block uppercase mb-1">Data</label>
                                                    <input required name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-transparent dark:text-white font-bold outline-none" />
                                                </div>
                                            )}
                                        </div>

                                        {isInstallment && (
                                            <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-3xl">
                                                <label className="text-[10px] font-black text-slate-400 block uppercase mb-1">Data da 1ª Parcela</label>
                                                <input required name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-transparent dark:text-white font-bold outline-none" />
                                            </div>
                                        )}

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 mb-1 uppercase">Forma</label><select name="cardId" className="w-full bg-transparent dark:text-white font-bold outline-none">{cards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                                            <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 mb-1 uppercase">Categoria</label><select name="category" className="w-full bg-transparent dark:text-white font-bold outline-none">{categories.map(c => <option key={c}>{c}</option>)}</select></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4 pb-4">
                                            <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 mb-1 uppercase">Quem Pagou?</label><select name="paidBy" className="w-full bg-transparent dark:text-white font-bold outline-none"><option value="user1">{user1Name}</option><option value="user2">{user2Name}</option></select></div>
                                            <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-3xl"><label className="text-[10px] font-black text-slate-400 mb-1 uppercase">Divisão</label><select name="split" className="w-full bg-transparent dark:text-white font-bold outline-none"><option value="shared">Casal (50/50)</option><option value="individual">Apenas Meu</option></select></div>
                                        </div>

                                        <div className="bg-pink-50 dark:bg-slate-700 p-4 rounded-3xl flex items-center justify-between cursor-pointer border-2 border-dashed border-pink-200 dark:border-slate-600" onClick={() => receiptInputRef.current?.click()}>
                                            <span className="text-pink-500 dark:text-pink-400 font-black text-xs flex items-center gap-2 uppercase"><ImagePlus className="w-5 h-5"/> {transactionPhoto ? 'Trocar Foto' : 'Guardar Lembrança'}</span>
                                            {transactionPhoto && <img src={transactionPhoto} className="w-10 h-10 rounded-xl object-cover shadow-md border-2 border-white dark:border-slate-800"/>}
                                            <input type="file" ref={receiptInputRef} onChange={(e) => handlePhotoUpload(e, 'newTransaction')} className="hidden" accept="image/*" />
                                        </div>

                                        <button className="w-full bg-gradient-to-r from-pink-500 to-rose-500 dark:from-indigo-500 dark:to-purple-500 text-white font-black py-5 rounded-3xl shadow-xl mt-2">Guardar no Bolso <Sparkles className="w-5 h-5"/></button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {isAddBudgetModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 shadow-2xl transition-colors">
                                    <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-600 rounded-full mx-auto mb-6"></div>
                                    <h3 className="text-xl font-black text-pink-600 dark:text-pink-400 mb-6 flex items-center gap-2"><AlertCircle className="w-6 h-6"/> Novo Alerta</h3>
                                    <form onSubmit={async e => { e.preventDefault(); const fd = new FormData(e.target); await saveDoc('budgets', { category: fd.get('category'), limit: parseCurrency(fd.get('limit')) }); setIsAddBudgetModalOpen(false); }} className="space-y-4">
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Categoria</label><select name="category" className="w-full bg-transparent dark:text-white font-bold outline-none">{categories.map(c => <option key={c}>{c}</option>)}</select></div>
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Limite Máximo (R$)</label><input name="limit" type="text" inputMode="decimal" required placeholder="Ex: 300,00" className="w-full bg-transparent dark:text-white font-black outline-none" /></div>
                                        <button className="w-full bg-pink-500 dark:bg-indigo-500 text-white font-black py-4 rounded-3xl shadow-lg mt-4">Ativar Alerta 🚨</button>
                                        <button type="button" onClick={()=>setIsAddBudgetModalOpen(false)} className="w-full text-slate-400 dark:text-slate-500 font-bold py-2">Cancelar</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* NOVO: Modal para o Mealheiro (Metas de Poupança) */}
                        {isAddSavingsModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 shadow-2xl transition-colors">
                                    <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-600 rounded-full mx-auto mb-6"></div>
                                    <h3 className="text-xl font-black text-emerald-600 dark:text-emerald-400 mb-6 flex items-center gap-2"><Wallet className="w-6 h-6"/> Nova Meta</h3>
                                    <form onSubmit={async e => { e.preventDefault(); const fd = new FormData(e.target); await saveDoc('savings', { title: fd.get('title'), targetAmount: parseCurrency(fd.get('targetAmount')), currentAmount: 0 }); setIsAddSavingsModalOpen(false); }} className="space-y-4">
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">O que vamos comprar?</label><input name="title" required placeholder="Ex: Viagem a Paris ✈️" className="w-full bg-transparent dark:text-white font-bold outline-none" /></div>
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Qual o valor total?</label><input name="targetAmount" type="text" inputMode="decimal" required placeholder="Ex: 2000,00" className="w-full bg-transparent dark:text-white font-black outline-none" /></div>
                                        <button className="w-full bg-emerald-500 text-white font-black py-4 rounded-3xl shadow-lg mt-4">Criar Mealheiro 🐷</button>
                                        <button type="button" onClick={()=>setIsAddSavingsModalOpen(false)} className="w-full text-slate-400 dark:text-slate-500 font-bold py-2">Cancelar</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {isAddChallengeModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 shadow-2xl transition-colors">
                                    <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-600 rounded-full mx-auto mb-6"></div>
                                    <h3 className="text-xl font-black text-purple-600 dark:text-purple-400 mb-6 flex items-center gap-2"><Trophy className="w-6 h-6"/> Novo Desafio</h3>
                                    <form onSubmit={async e => { e.preventDefault(); const fd = new FormData(e.target); await saveDoc('challenges', { title: fd.get('title'), target: parseInt(fd.get('target'))||1, progress: 0, icon: selectedChallengeIcon }); setIsAddChallengeModalOpen(false); }} className="space-y-4">
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">O que faremos?</label><input name="title" required placeholder="Ex: Sem Uber Eats 🍕" className="w-full bg-transparent dark:text-white font-bold outline-none" /></div>
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Quantas vezes/dias?</label><input name="target" type="number" required placeholder="Alvo (ex: 7)" className="w-full bg-transparent dark:text-white font-black outline-none" /></div>
                                        <div className="flex gap-4">
                                            <button type="button" onClick={() => setSelectedChallengeIcon('Flame')} className={`flex-1 p-4 rounded-2xl border-2 transition-all shadow-sm ${selectedChallengeIcon==='Flame'?'bg-purple-500 border-purple-500 text-white':'bg-slate-50 dark:bg-slate-700 border-transparent text-slate-400'}`}><Flame className="mx-auto"/></button>
                                            <button type="button" onClick={() => setSelectedChallengeIcon('PiggyBank')} className={`flex-1 p-4 rounded-2xl border-2 transition-all shadow-sm ${selectedChallengeIcon==='PiggyBank'?'bg-purple-500 border-purple-500 text-white':'bg-slate-50 dark:bg-slate-700 border-transparent text-slate-400'}`}><PiggyBank className="mx-auto"/></button>
                                        </div>
                                        <button className="w-full bg-purple-500 text-white font-black py-4 rounded-3xl shadow-lg mt-4">Lançar Desafio 🚀</button>
                                        <button type="button" onClick={()=>setIsAddChallengeModalOpen(false)} className="w-full text-slate-400 dark:text-slate-500 font-bold py-2">Desistir</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {isAddSubModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 shadow-2xl max-h-[90dvh] overflow-y-auto hide-scrollbar transition-colors">
                                    <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-600 rounded-full mx-auto mb-6"></div>
                                    <h3 className="text-xl font-black text-pink-600 dark:text-pink-400 mb-6 flex items-center gap-2"><Repeat className="w-5 h-5"/> {editingSub ? 'Editar Despesa Fixa' : 'Nova Despesa Fixa'}</h3>
                                    <form onSubmit={handleSaveSubscription} className="space-y-4">
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Nome</label><input name="name" defaultValue={editingSub?.name} required placeholder="Netflix, Aluguer..." className="w-full bg-transparent dark:text-white font-bold outline-none" /></div>
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Valor Mensal</label><input name="amount" defaultValue={editingSub?.amount ? String(editingSub.amount).replace('.', ',') : ''} type="text" inputMode="decimal" required placeholder="0,00" className="w-full bg-transparent dark:text-white font-black outline-none" /></div>
                                        
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Mês de Início</label><input name="startMonth" type="month" required defaultValue={editingSub?.startMonth || selectedMonth} className="w-full bg-transparent dark:text-white font-bold outline-none" /></div>
                                            <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Mês de Fim (Opcional)</label><input name="endMonth" type="month" defaultValue={editingSub?.endMonth || ''} className="w-full bg-transparent dark:text-white font-bold outline-none" /></div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4 pb-4">
                                            <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Quem?</label><select name="paidBy" defaultValue={editingSub?.paidBy || 'user1'} className="w-full bg-transparent dark:text-white font-bold outline-none"><option value="user1">{user1Name}</option><option value="user2">{user2Name}</option></select></div>
                                            <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Divisão</label><select name="split" defaultValue={editingSub?.split || 'shared'} className="w-full bg-transparent dark:text-white font-bold outline-none"><option value="shared">Casal</option><option value="individual">Individual</option></select></div>
                                        </div>
                                        <button className="w-full bg-pink-500 dark:bg-indigo-500 text-white font-black py-4 rounded-3xl shadow-lg">Guardar Fixa 🎀</button>
                                        <button type="button" onClick={() => { setIsAddSubModalOpen(false); setEditingSub(null); }} className="w-full text-slate-400 dark:text-slate-500 font-bold py-2">Cancelar</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {isAddDateModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center z-50 p-2 sm:p-0">
                                <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-[3rem] sm:rounded-t-[3rem] sm:rounded-b-none p-6 pb-16 sm:pb-12 shadow-2xl transition-colors">
                                    <div className="w-12 h-1.5 bg-slate-200 dark:bg-slate-600 rounded-full mx-auto mb-6"></div>
                                    <h3 className="text-xl font-black text-pink-600 dark:text-pink-400 mb-6 flex items-center gap-2"><CalendarDays className="w-6 h-6"/> Momento Inesquecível</h3>
                                    <form onSubmit={async e => { e.preventDefault(); const fd = new FormData(e.target); await saveDoc('specialDates', { title: fd.get('title'), date: fd.get('date'), frequency: dateFormFrequency }); setIsAddDateModalOpen(false); }} className="space-y-4">
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">O que comemoramos?</label><input name="title" required placeholder="Ex: Nosso Aniversário" className="w-full bg-transparent dark:text-white font-bold outline-none" /></div>
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 block mb-1 uppercase">Qual a Data?</label><input name="date" type="date" required className="w-full bg-transparent dark:text-white font-bold outline-none" /></div>
                                        <div className="flex gap-2">
                                            <button type="button" onClick={()=>setDateFormFrequency('monthly')} className={`flex-1 py-3 text-[10px] sm:text-xs rounded-2xl font-black transition-all shadow-sm ${dateFormFrequency==='monthly'?'bg-pink-500 dark:bg-indigo-500 text-white':'bg-slate-50 dark:bg-slate-700 text-slate-400'}`}>Todo Mês 🗓️</button>
                                            <button type="button" onClick={()=>setDateFormFrequency('yearly')} className={`flex-1 py-3 text-[10px] sm:text-xs rounded-2xl font-black transition-all shadow-sm ${dateFormFrequency==='yearly'?'bg-pink-500 dark:bg-indigo-500 text-white':'bg-slate-50 dark:bg-slate-700 text-slate-400'}`}>Todo Ano ✨</button>
                                            <button type="button" onClick={()=>setDateFormFrequency('once')} className={`flex-1 py-3 text-[10px] sm:text-xs rounded-2xl font-black transition-all shadow-sm ${dateFormFrequency==='once'?'bg-pink-500 dark:bg-indigo-500 text-white':'bg-slate-50 dark:bg-slate-700 text-slate-400'}`}>Uma Vez 💖</button>
                                        </div>
                                        <button className="w-full bg-pink-600 dark:bg-indigo-600 text-white font-black py-4 rounded-3xl shadow-lg mt-4">Eternizar Data</button>
                                        <button type="button" onClick={()=>setIsAddDateModalOpen(false)} className="w-full text-slate-400 dark:text-slate-500 font-bold py-2">Cancelar</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {showMimoModal && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                                <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[3rem] p-6 text-center shadow-2xl border-4 border-pink-100 dark:border-slate-700 transition-colors">
                                    <Gift className="w-12 h-12 text-pink-500 dark:text-pink-400 mx-auto mb-4" />
                                    <h3 className="text-xl font-black text-pink-600 dark:text-pink-400 mb-2 tracking-tighter">Pagar com Mimo 🎁</h3>
                                    <form onSubmit={handlePayWithMimoSubmit} className="space-y-4 text-left">
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 uppercase block mb-1">Qual o Mimo?</label><input required name="title" value={mimoTitle} onChange={e=>setMimoTitle(e.target.value)} placeholder="Ex: Pizza dos sonhos..." className="w-full bg-transparent dark:text-white font-bold outline-none" /></div>
                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-2xl"><label className="text-[10px] font-black text-slate-400 uppercase block mb-1">Valor Estimado</label><input required name="amount" type="text" inputMode="decimal" placeholder="0,00" className="w-full bg-transparent dark:text-white font-black outline-none" /></div>
                                        <button className="w-full bg-pink-500 dark:bg-indigo-500 text-white font-black py-4 rounded-3xl shadow-lg">Quitar Dívida com Amor 💖</button>
                                        <button type="button" onClick={()=>setShowMimoModal(false)} className="w-full text-slate-400 dark:text-slate-500 font-bold py-2 text-sm">Talvez depois</button>
                                    </form>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
